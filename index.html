<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadeia</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-61T0721KTX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-61T0721KTX');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root {
    --leather: #241207;
    --leather-dark: #150a04;
    --paper: #e7d8ae;
    --paper-shadow: #cbb37e;
    --ink: #2b1a0d;
    --maroon: #6d1420;
    --gold: #a4772f;
    --gold-bright: #c99a3e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 0%, #3a220f, var(--leather) 55%, var(--leather-dark) 100%);
    color: var(--ink);
    font-family: 'IM Fell English', Georgia, serif;
    display: flex;
    justify-content: center;
    padding: 3.5rem 1.25rem;
  }

  .tome {
    position: relative;
    width: 100%;
    max-width: 760px;
    background:
      radial-gradient(circle at 15% 20%, rgba(120, 90, 40, 0.18), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(120, 90, 40, 0.15), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(90, 60, 20, 0.12), transparent 50%),
      var(--paper);
    padding: 2.75rem 3rem 2.5rem;
    border: 1px solid var(--gold);
    box-shadow:
      0 0 0 8px var(--paper),
      0 0 0 9px var(--gold),
      0 25px 60px rgba(0, 0, 0, 0.65),
      inset 0 0 90px rgba(90, 60, 20, 0.25);
  }

  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position: absolute;
    color: var(--gold);
    font-size: 1.1rem;
    line-height: 1;
  }
  .corner-tl { top: -1px; left: -1px; transform: translate(-50%, -50%); }
  .corner-tr { top: -1px; right: -1px; transform: translate(50%, -50%); }
  .corner-bl { bottom: -1px; left: -1px; transform: translate(-50%, 50%); }
  .corner-br { bottom: -1px; right: -1px; transform: translate(50%, 50%); }

  header {
    text-align: center;
    margin-bottom: 1.75rem;
  }

  .eyebrow {
    margin: 0 0 0.35rem;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: var(--maroon);
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    letter-spacing: 0.12em;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .rule {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin: 1.1rem auto 0;
    max-width: 320px;
    color: var(--maroon);
  }

  .rule::before,
  .rule::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .rule span {
    font-size: 0.85rem;
  }

  .plate {
    margin: 2rem 0 1.75rem;
    padding: 10px;
    background: var(--paper-shadow);
    border: 1px solid var(--gold);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  .plate img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid rgba(43, 26, 13, 0.5);
    filter: sepia(0.18) saturate(1.05);
  }

  .plate figcaption {
    margin-top: 0.6rem;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .plate figcaption em {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    text-transform: none;
    letter-spacing: normal;
  }

  p.lede {
    font-size: 1.25rem;
    line-height: 1.7;
    text-align: center;
    color: var(--ink);
    max-width: 46ch;
    margin: 0 auto;
  }

  .dropcap {
    float: left;
    font-family: 'UnifrakturMaguntia', cursive;
    font-size: 3.6rem;
    line-height: 0.8;
    padding: 0.1rem 0.35rem 0 0;
    color: var(--maroon);
  }

  footer {
    margin-top: 2.25rem;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }
</style>
</head>
<body>
  <div class="tome">
    <span class="corner-tl">&#10022;</span>
    <span class="corner-tr">&#10022;</span>
    <span class="corner-bl">&#10022;</span>
    <span class="corner-br">&#10022;</span>

    <header>
      <p class="eyebrow">A Chronicle Of</p>
      <h1>Jadeia</h1>
      <div class="rule"><span>&#10022;</span></div>
    </header>

    <figure class="plate">
      <img src="images/party-header.jpg" alt="An adventuring party stands before a slain dragon, hoisted and bound, its hoard at their feet.">
      <figcaption>Plate I &mdash; <em>The Reckoning of the Wyrm</em></figcaption>
    </figure>

    <p class="lede"><span class="dropcap">M</span>ore chronicles shall be inscribed here in time.</p>

    <footer>Jadeia &middot; MMXXVI</footer>
  </div>
</body>
</html>
